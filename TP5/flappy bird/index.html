<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flappy bird</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-container">
        <div id="pipes-container"></div>

        <div class="capa capa-1"></div>
        <div class="capa capa-3"></div>
        <div class="capa capa-4"></div>
        <div class="capa capa-2"></div>
        <div class="capa capa-5"></div>
        <div class="capa capa-6"></div>
        <div class="capa capa-7"></div>
        <div class="capa capa-8"></div>

        <div id="bird"></div>

        <div id="score-container">
            <div id="score">0</div>
        </div>

        <div id="hud">
            <div id="lives">
                <div class="life full"></div>
                <div class="life full"></div>
                <div class="life full"></div>
            </div>
        </div>
    </div>

    <script src="js/Hud.js"></script>
    <script src="js/Bird.js"></script>
    <script src="js/Coin.js"></script>
    <script src="js/Heart.js"></script>
    <script src="js/Game.js"></script>
</body>
</html>
